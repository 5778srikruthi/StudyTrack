<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - StudyTrack</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>StudyTrack Dashboard</h1>
        <p>Welcome to your study dashboard.</p>
    </header>

    <main>

        <section>
            <h2>My Tasks</h2>

            <p>Total Tasks: <span id="totalTasks">0</span></p>
            <p>Completed: <span id="completedTasks">0</span></p>
            <p>Pending: <span id="pendingTasks">0</span></p>
        </section>

        <section>
            <h2>Tasks</h2>

            <ul id="taskList">
                <li>No tasks yet.</li>
            </ul>
        </section>

    </main>

</body>
</html>
